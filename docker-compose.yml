# Local PostgreSQL for running the app (the test suite needs no services).
#   docker compose up -d
#   python -m app.database.seed
#   uvicorn app.main:app --reload
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: order_approval
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_approval"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
